<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Wars</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  background:radial-gradient(circle at top,#25264a 0,#11121d 45%,#090a10 100%);
  color:#f7f7fb; padding:28px;
}
.app{max-width:1000px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo{font-size:28px;font-weight:800;letter-spacing:-1px}
.logo span{opacity:.55}
.card{
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
  border-radius:22px; padding:24px; backdrop-filter:blur(14px);
  box-shadow:0 18px 60px rgba(0,0,0,.25);
}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}
h1{font-size:42px;line-height:1;margin:0 0 10px;letter-spacing:-2px}
.sub{color:#a9aabd;margin-bottom:28px}
.timer{text-align:center}
.time{font-variant-numeric:tabular-nums;font-size:72px;font-weight:800;letter-spacing:-4px;margin:15px 0}
button{
  border:0;border-radius:13px;padding:13px 20px;font-size:15px;font-weight:700;
  cursor:pointer;background:#fff;color:#11121d;margin:4px;
}
button.secondary{background:rgba(255,255,255,.1);color:#fff}
button.danger{background:#ff5f6d;color:white}
.players{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
.player{padding:20px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.player.active{outline:2px solid rgba(255,255,255,.5)}
.name{font-weight:800;font-size:18px}
.total{font-size:34px;font-weight:800;margin-top:10px}
.bar{height:8px;background:rgba(255,255,255,.09);border-radius:10px;overflow:hidden;margin-top:12px}
.fill{height:100%;background:#fff;border-radius:10px;width:0%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.stat small{color:#9d9eaf}.stat strong{display:block;font-size:25px;margin-top:7px}
.section-title{margin:28px 0 12px;font-size:18px}
.history{max-height:220px;overflow:auto}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);color:#c9cad5}
select{
  background:#202130;color:#fff;border:1px solid #3a3b4c;border-radius:10px;padding:10px;
}
@media(max-width:750px){
  body{padding:15px}.hero{grid-template-columns:1fr}h1{font-size:34px}.time{font-size:58px}
  .stats{grid-template-columns:1fr}.players{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">⚔️ Study <span>Wars</span></div>
  <select id="playerSelect">
    <option value="you">N</option>
    <option value="friend">Z</option>
  </select>
</header>

<div class="hero">
  <div class="card">
    <h1>Study harder.<br>Win the day.</h1>
    <div class="sub">A simple head-to-head study timer.</div>
    <div class="timer">
      <div class="time" id="timer">00:00:00</div>
      <button id="start">Start studying</button>
      <button id="reset" class="secondary">Reset session</button>
    </div>
  </div>

  <div class="card">
    <h2>🏆 Today's leaderboard</h2>
    <div class="players">
      <div class="player" id="youCard">
        <div class="name">N</div>
        <div class="total" id="youTotal">0m</div>
        <div class="bar"><div class="fill" id="youBar"></div></div>
      </div>
      <div class="player" id="friendCard">
        <div class="name">Z</div>
        <div class="total" id="friendTotal">0m</div>
        <div class="bar"><div class="fill" id="friendBar"></div></div>
      </div>
    </div>
    <p id="lead" class="sub" style="margin:18px 0 0"></p>
  </div>
</div>

<div class="stats">
  <div class="card stat"><small>Today</small><strong id="today">0h 0m</strong></div>
  <div class="card stat"><small>Weekly total</small><strong id="week">0h 0m</strong></div>
  <div class="card stat"><small>🔥 Streak</small><strong id="streak">0 days</strong></div>
</div>

<div class="section-title">Session history</div>
<div class="card history" id="history">Loading data...</div>
</div>

<script>
let data = { you: 0, friend: 0, history: [], days: {} };
let current = "you", running = false, startTime = 0, elapsed = 0, interval = null;

const $ = id => document.getElementById(id);

async function loadData() {
  try {
    const res = await fetch('/api/study-data');
    if (res.ok) {
      data = await res.json();
    }
  } catch (err) {
    console.error("Failed to load cloud data:", err);
  }
  render();
}

async function save() {
  try {
    await fetch('/api/study-data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
  } catch (err) {
    console.error("Failed to save data to cloud:", err);
  }
}

function fmt(sec){
  sec=Math.floor(sec); let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return [h,m,s].map(x=>String(x).padStart(2,"0")).join(":");
}
function short(sec){
  let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);
  return h?`${h}h ${m}m`:`${m}m`;
}
function dayKey(d=new Date()){return d.toISOString().slice(0,10)}

function render(){
  $("timer").textContent=fmt(elapsed);
  $("youTotal").textContent=short(data.you);
  $("friendTotal").textContent=short(data.friend);
  let max=Math.max(data.you,data.friend,1);
  $("youBar").style.width=(data.you/max*100)+"%";
  $("friendBar").style.width=(data.friend/max*100)+"%";
  if(data.you===data.friend) $("lead").textContent="It's tied. 👀";
  else {
    let winner=data.you>data.friend?"N":"Z";
    $("lead").textContent=`${winner} is leading by ${short(Math.abs(data.you-data.friend))}.`;
  }
  $("today").textContent=short(data[current]);
  $("week").textContent=short(data[current]);
  $("streak").textContent=calcStreak()+" days";
  $("history").innerHTML=data.history.length
    ? data.history.slice().reverse().map(x=>`<div class="row"><span>${x.player==="you"?"N":"Z"} · ${x.date}</span><b>${short(x.seconds)}</b></div>`).join("")
    : "No sessions yet.";
  $("youCard").classList.toggle("active",current==="you");
  $("friendCard").classList.toggle("active",current==="friend");
}

function calcStreak(){
  let count=0,d=new Date();
  while(data.days[dayKey(d)]){count++;d.setDate(d.getDate()-1)}
  return count;
}

$("playerSelect").onchange=e=>{current=e.target.value;elapsed=0;render()};

$("start").onclick = async () => {
  if(!running){
    running=true; startTime=Date.now()-elapsed*1000;
    $("start").textContent="Stop & save";
    $("start").className="danger";
    interval=setInterval(()=>{elapsed=Math.floor((Date.now()-startTime)/1000);render()},250);
  }else{
    clearInterval(interval); running=false;
    if(elapsed>0){
      data[current]+=elapsed;
      data.history.push({player:current,seconds:elapsed,date:new Date().toLocaleString()});
      data.days[dayKey()]=true;
      await save();
    }
    elapsed=0;
    $("start").textContent="Start studying"; $("start").className="";
    render();
  }
};

$("reset").onclick=()=>{if(!running){elapsed=0;render()}};

loadData();
</script>
</body>
</html>
